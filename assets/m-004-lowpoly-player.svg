<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Low-poly volleyball player silhouette">
  <title>M-004 Low-poly player silhouette</title>
  <g fill="#f2f0eb">
    <!-- low-poly head -->
    <polygon points="100,18 118,32 112,52 88,52 82,32"/>
    <!-- neck -->
    <polygon points="92,52 108,52 106,62 94,62"/>
    <!-- torso facets -->
    <polygon points="70,62 100,58 100,110 55,105"/>
    <polygon points="100,58 130,62 145,105 100,110"/>
    <!-- raised arm (right) facets -->
    <polygon points="128,68 155,35 168,42 145,78"/>
    <polygon points="155,35 175,22 182,32 168,42"/>
    <!-- left arm -->
    <polygon points="70,75 35,95 42,108 78,88"/>
    <!-- ball as hex-ish -->
    <polygon points="22,88 32,78 44,82 46,96 36,106 24,100" fill="none" stroke="#f2f0eb" stroke-width="2.5"/>
    <line x1="28" y1="84" x2="40" y2="98" stroke="#f2f0eb" stroke-width="1.5"/>
    <line x1="38" y1="82" x2="28" y2="98" stroke="#f2f0eb" stroke-width="1.5"/>
    <!-- legs low-poly -->
    <polygon points="75,105 100,110 95,175 70,168"/>
    <polygon points="100,110 130,105 140,175 110,180"/>
    <!-- feet -->
    <polygon points="65,168 95,175 90,190 58,182"/>
    <polygon points="110,180 140,175 155,188 118,195"/>
